[project]
name = "harness-lab"
version = "0.1.0"
description = "Harness Lab: an agent harness for Harness Arena (code solvers over a fact layer, small-model fallback) and its offline replay lab"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.55",
    "openpyxl>=3.1.5",
    "pydantic>=2.6",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["harvester/data", "runs"]

[tool.ruff.lint]
# Errors that matter (syntax, undefined/unused names, ambiguous names). Formatting is hand-kept at 120 columns;
# `ruff format` is not applied (it would rewrite ~5k lines of history for quote style alone).
select = ["E4", "E7", "E9", "F", "PLE"]
ignore = [
    "E731",  # small row-accessor lambdas inside loops are used on purpose
    "E402",  # scripts put the repo on sys.path before importing it
]

[tool.ruff.lint.per-file-ignores]
# dev scripts and the replay emulation favour compact one-line filters and short loop names
"tests/**" = ["E701", "E702", "E741"]
"harvester/**" = ["E701", "E702", "E741"]
